[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grapheditor-pro"
version = "1.5.0"
description = "Advanced interactive graph editor with animations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "valkaa"}]
keywords = ["matplotlib", "tkinter", "charts", "visualization", "editor"]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tkinterdnd2>=0.4",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "openpyxl>=3.1",
    "plotly>=5.18",
    "scipy>=1.11",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev   = ["pytest>=7", "pytest-cov", "ruff>=0.4", "pre-commit"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
grapheditor = "grapheditor.main:main"

[tool.setuptools]
packages = ["grapheditor"]
include-package-data = true

[tool.setuptools.package-data]
grapheditor = ["assets/*", "assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B011"]

[tool.ruff.lint.per-file-ignores]
"grapheditor/translator.py" = ["E501"]

[tool.coverage.run]
source = ["grapheditor"]
omit   = ["*/translator.py", "*/__init__.py"]